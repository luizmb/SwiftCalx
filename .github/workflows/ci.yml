name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-macos-accelerate:
    name: Build & Test (macOS / Accelerate)
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Cache Mint packages
        uses: actions/cache@v6
        with:
          path: ~/.mint
          key: ${{ runner.os }}-mint-${{ hashFiles('Mintfile') }}
          restore-keys: ${{ runner.os }}-mint-

      - name: Cache Homebrew downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-homebrew-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: ${{ runner.os }}-homebrew-

      - name: Install Mint
        run: brew install mint

      - name: Install Periphery
        run: brew install peripheryapp/periphery/periphery

      - name: Install SwiftLint
        run: mint bootstrap

      - name: Lint
        run: mint run swiftlint lint --strict

      - name: Build
        run: swift build 2>&1

      - name: Test
        run: swift test 2>&1

      - name: Periphery
        run: periphery scan

  test-macos-fallback:
    name: Build & Test (macOS / scalar fallback)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Build (-D SWIFTCALX_NO_ACCELERATE)
        run: swift build -Xswiftc -DSWIFTCALX_NO_ACCELERATE 2>&1

      - name: Test (-D SWIFTCALX_NO_ACCELERATE)
        run: swift test -Xswiftc -DSWIFTCALX_NO_ACCELERATE 2>&1

  test-linux:
    name: Build & Test (Linux / scalar)
    runs-on: ubuntu-latest
    # swift-actions/setup-swift has no 6.3 yet — use the official Swift 6.3 container.
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: swift build 2>&1

      - name: Test
        run: swift test 2>&1

  # Builds against the LATEST versions allowed by Package.swift (not the pinned Package.resolved),
  # so a source-breaking change shipped in a dependency's minor (e.g. FP 1.13's `Monoid.mconcat`
  # shadowing) fails here — at the source — instead of only surfacing downstream in an app.
  # Dependabot proposes version bumps but never compiles them; this closes that gap.
  test-latest-deps:
    name: Build & Test (latest dependencies)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Resolve to latest allowed dependency versions
        run: swift package update 2>&1

      - name: Build
        run: swift build 2>&1

      - name: Test
        run: swift test 2>&1
